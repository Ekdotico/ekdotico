name: ci

# Every pull request, and every push to main. Node.js comes from .nvmrc, which
# holds the 26 line (NFR-IC-03). Actions are pinned to a commit, with the
# release in the comment.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # The whole run took 17 to 19 minutes before the tests of October 2026 that hold a key
    # for 30 seconds; at 20 it was cut off in the last step with every step before it passed.
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=en_US.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Reads @ekdotico/domico from GitHub Packages. The package has to grant
      # this repository access under "Manage Actions access".
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FOUNDING_TEAM_EMAILS: ''
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      VALKEY_URL: redis://localhost:6379
      # The local object store of the images, started below (FR-ED-08, NFR-SE-18). The keys are the
      # ones in docker/object-store-s3.json: they open that store and nothing else.
      IMAGE_STORAGE_ENDPOINT: http://localhost:8333
      IMAGE_STORAGE_BUCKET: ekdotico-images
      IMAGE_STORAGE_ACCESS_KEY_ID: ekdotico-dev-access
      IMAGE_STORAGE_SECRET_ACCESS_KEY: ekdotico-dev-secret-key-0000000000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # Writes a user-level .npmrc that names NODE_AUTH_TOKEN for this
          # registry. pnpm does not take a registry credential from the
          # project's .npmrc, so the token cannot be configured there.
          registry-url: https://npm.pkg.github.com
          scope: '@ekdotico'
      - run: pnpm install --frozen-lockfile
      - name: Exact pins and licences (NFR-IC-08, NFR-IC-12)
        run: pnpm check:deps
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # A `services:` entry cannot be given the command the store is started with, so it is run here.
      - name: Object store of the images (S3 protocol), and its bucket
        run: |
          docker run -d --name objectstore -p 8333:8333 \
            -v "$PWD/docker/object-store-s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.48 server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
          node scripts/create-bucket.ts
      - name: Integration tests against PostgreSQL and Valkey (provisioning and migrations of contract IC-51 among them)
        run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
