# Local equivalents of the production services, for development only.
# Production is DigitalOcean Frankfurt and is the owner's to provision.
#
# The object store for images and the reverse proxy that puts the collaboration
# server on the application's origin join this file with the slices that first
# use them.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ekdotico
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=en_US.UTF-8
    ports:
      - '5432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8
    ports:
      - '6379:6379'

volumes:
  postgres:
