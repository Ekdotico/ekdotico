# Local equivalents of the production services, for development only.
# Production is DigitalOcean Frankfurt and is the owner's to provision.
#
# The object store for images joins this file with the slice that first uses
# it. There is no reverse proxy here: on a development machine the web
# application serves the collaboration server on its own origin itself
# (COLLAB_PROXY_TARGET; README.md).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ekdotico
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=en_US.UTF-8
    ports:
      - '5432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8
    ports:
      - '6379:6379'

volumes:
  postgres:
